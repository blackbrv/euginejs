name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      - name: Validate npm package contents
        run: |
          for pkg in core renderer renderer-server; do
            npm pack --dry-run -w "@eugine/$pkg"
          done
          npm pack --dry-run -w eugine
