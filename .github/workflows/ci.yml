name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The @eugine/* library packages support Node >=18.18, but this repo
        # also builds the Next.js examples (examples/*), which require Node
        # >=20.9 — `npm run build` runs across every workspace, so the whole
        # matrix must satisfy the strictest requirement in the tree.
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # build MUST run before typecheck: packages resolve each other via
      # their published "types" field (./dist/*.d.ts), which only exists
      # after a build. Running typecheck first fails with "Cannot find
      # module '@eugine/core'" on a fresh checkout.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test
      - name: Validate npm package contents
        run: |
          for pkg in core renderer renderer-server; do
            npm pack --dry-run -w "@eugine/$pkg"
          done
          npm pack --dry-run -w eugine
